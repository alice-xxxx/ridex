[package]
name = "ridex"
version = "0.1.0"
description = "RideX vehicle BLE configuration and diagnostics"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ridex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-blec = "0.12.0"
uuid = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tauri-plugin-log = "2"
chrono = "0.4"
crossbeam-queue = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
zeroize = "1.9.0"
aes = "0.9"
aes-gcm = { version = "0.11", features = ["getrandom"] }
crc = "3.4"
ecb = "0.2"
rand = "0.10"
ringbuf = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
bin_file = "0.2.1"
tauri-plugin-machine-uid = "0.1.3"
tauri-plugin-os = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-serialplugin = "3.0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
